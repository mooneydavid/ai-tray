<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Settings</title>
<style>
  @font-face { font-family: Inter; src: url('../assets/fonts/Inter.woff2') format('woff2'); font-weight: 100 900; font-display: block; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #11100e;
    --ink: #efece6;
    --muted: #b3ada3;
    --line: #262420;
    --card: #191815;
    --tile: #1d1c19;
    --tile-line: #2e2c27;
    --warn: #f0b35e;
    --high: #f2826f;
    --sans: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }

  html, body {
    width: 420px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 500;
    font-size: 13px;
    line-height: 1.5;
    letter-spacing: -.011em;
    font-feature-settings: 'cv11', 'ss03';
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  svg { display: block; flex-shrink: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* Title bar: Windows draws its own min/close buttons over the right side */
  .titlebar {
    height: 40px; display: flex; align-items: center; padding: 0 20px;
    font-size: 14px; font-weight: 600; -webkit-app-region: drag;
  }

  .app { display: flex; flex-direction: column; gap: 22px; padding: 6px 20px 20px; }


  .list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 56px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row-main { flex: 1; min-width: 0; }
  .row-name { font-size: 14px; font-weight: 600; line-height: 1.35; }
  .row-text { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-text.bad { color: var(--high); }
  .row-text.stale { color: var(--warn); }

  .link-btn {
    display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
    height: 30px; padding: 0 12px; border-radius: 15px;
    background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 600;
    transition: background-color .2s ease, transform .15s ease;
  }
  .link-btn:hover { background: #fff; }
  .link-btn:active { transform: scale(.97); }
  .link-btn svg { width: 14px; height: 14px; }

  /* Switch */
  .switch { position: relative; width: 38px; height: 22px; flex-shrink: 0; }
  .switch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; }
  .switch i {
    position: absolute; inset: 0; border-radius: 11px; background: var(--tile-line); pointer-events: none;
    transition: background-color .2s ease;
  }
  .switch i::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--muted); transition: transform .2s cubic-bezier(.2, .8, .2, 1), background-color .2s ease;
  }
  .switch input:checked + i { background: var(--ink); }
  .switch input:checked + i::after { transform: translateX(16px); background: var(--bg); }
  .switch input:focus-visible + i { outline: 2px solid var(--ink); outline-offset: 2px; }

  .saved { position: fixed; right: 20px; bottom: 16px; font-size: 13px; color: var(--muted);
    opacity: 0; transition: opacity .3s ease; }
  .saved.on { opacity: 1; }
</style>
</head>
<body>
<div class="titlebar">Settings</div>
<div class="app">
  <section>
    <div class="list">
      <div class="row" data-provider="claude">
        <div class="row-main">
          <div class="row-name">Claude Max</div>
          <div class="row-text" id="text-claude">Checking…</div>
        </div>
        <span id="action-claude"></span>
      </div>
      <div class="row" data-provider="codex">
        <div class="row-main">
          <div class="row-name">ChatGPT / Codex</div>
          <div class="row-text" id="text-codex">Checking…</div>
        </div>
        <span id="action-codex"></span>
        <label class="switch" title="Show in AI Tray"><input type="checkbox" id="toggle-codex"><i></i></label>
      </div>
      <div class="row" data-provider="grok">
        <div class="row-main">
          <div class="row-name">Grok</div>
          <div class="row-text" id="text-grok">Checking…</div>
        </div>
        <span id="action-grok"></span>
        <label class="switch" title="Show in AI Tray"><input type="checkbox" id="toggle-grok"><i></i></label>
      </div>
    </div>
  </section>
</div>
<div class="saved" id="saved">Saved</div>

<script>
  const PROVIDER_IDS = ['codex', 'grok'];
  const LOGIN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12h-7m0 0 3 3m-3-3 3-3"/><path d="M19 6V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1"/></svg>';

  function setRow(id, text, cls, action) {
    const t = document.getElementById(`text-${id}`);
    t.textContent = text;
    t.className = 'row-text' + (cls ? ' ' + cls : '');
    t.title = text;
    document.getElementById(`action-${id}`).innerHTML = action === 'login'
      ? `<button class="link-btn" data-login="${id}">${LOGIN_ICON}<span>Sign in</span></button>` : '';
  }

  function render(data) {
    const cu = data && data.claudeUsage;
    if (!cu) setRow('claude', 'Checking…');
    else if (cu.error && /expired|401|re-authenticate/i.test(cu.error)) setRow('claude', 'Signed out', 'bad', 'login');
    else if (cu.error && /No Claude OAuth token/i.test(cu.error)) setRow('claude', 'Claude Code isn’t signed in', 'bad');
    else if (cu.error) setRow('claude', 'Can’t connect right now', 'bad');
    else if (cu.staleError) setRow('claude', 'Connected, last update failed', 'stale');
    else setRow('claude', 'Connected');

    for (const id of PROVIDER_IDS) {
      const enabled = data?.enabledProviders?.[id];
      const pu = data?.providers?.[id];
      if (!enabled) setRow(id, 'Hidden');
      else if (!pu) setRow(id, 'Checking…');
      else if (pu.needsLogin) setRow(id, 'Signed out', 'bad', 'login');
      else if (pu.error) setRow(id, 'Can’t connect right now', 'bad');
      else if (pu.staleError) setRow(id, 'Connected, last update failed', 'stale');
      else setRow(id, pu.plan ? `Connected · ${pu.plan}` : 'Connected');
    }

    document.querySelectorAll('[data-login]').forEach(btn => btn.addEventListener('click', async () => {
      const id = btn.dataset.login;
      btn.disabled = true;
      btn.querySelector('span').textContent = 'Waiting…';
      const r = id === 'claude' ? await window.ai.reAuthenticate() : await window.ai.providerLogin(id);
      if (!r || !r.success) { btn.disabled = false; btn.querySelector('span').textContent = 'Sign in'; }
    }));
  }

  // Changes save as you make them
  let savedTimer = null;
  async function save() {
    const config = await window.ai.getConfig();
    config.providers = config.providers || {};
    for (const id of PROVIDER_IDS) config.providers[id] = document.getElementById(`toggle-${id}`).checked;
    await window.ai.saveConfig(config);
    const s = document.getElementById('saved');
    s.classList.add('on');
    clearTimeout(savedTimer);
    savedTimer = setTimeout(() => s.classList.remove('on'), 1600);
  }

  for (const id of PROVIDER_IDS) document.getElementById(`toggle-${id}`).addEventListener('change', save);

  window.ai.onDataUpdate(render);

  (async () => {
    const config = await window.ai.getConfig();
    for (const id of PROVIDER_IDS) document.getElementById(`toggle-${id}`).checked = !!(config.providers && config.providers[id]);
    render(await window.ai.getData());
  })();
</script>
</body>
</html>
