<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src 'self' file:; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tray</title>
<style>
  @font-face { font-family: Inter; src: url('../assets/fonts/Inter.woff2') format('woff2'); font-weight: 100 900; font-display: block; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Warm near-black, cream ink */
  :root {
    --bg: #11100e;
    --ink: #efece6;
    --muted: #b3ada3;
    --line: #262420;
    --card: #191815;
    --tile: #1d1c19;
    --tile-line: #2e2c27;
    --track: #312e29;
    --warn: #f0b35e;
    --high: #f2826f;
    --sans: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-icon: cubic-bezier(0.2, 0, 0, 1);
  }

  html, body {
    width: 340px;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 500;
    font-size: 13px;
    line-height: 1.5;
    letter-spacing: -.011em;
    font-feature-settings: 'cv11', 'ss03';
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }
  svg { display: block; flex-shrink: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* Two views share one spot; the window fits whichever is showing */
  .views { display: grid; position: relative; }
  .view {
    grid-area: 1 / 1;
    display: flex; flex-direction: column; gap: 10px; padding: 12px;
    transition: opacity 180ms var(--ease-out), transform 240ms var(--ease-out), visibility 0s;
  }
  .view[inert] { position: absolute; inset: 0 0 auto 0; opacity: 0; visibility: hidden; transition: opacity 120ms var(--ease-out), transform 240ms var(--ease-out), visibility 0s 240ms; }
  #view-main[inert] { transform: translateX(-12px); }
  #view-settings[inert] { transform: translateX(12px); }
  .views.instant .view { transition: none; }

  /* Header: draggable to move the window */
  .header {
    display: flex; align-items: center; gap: 2px;
    padding: 0 2px 0 4px; height: 32px;
    -webkit-app-region: drag;
  }
  .title { font-size: 14px; font-weight: 600; letter-spacing: -.015em; margin-right: auto; }
  .header button { -webkit-app-region: no-drag; }
  #view-settings .header { padding-left: 0; }

  .icon-btn {
    width: 30px; height: 30px; border-radius: 8px;
    display: grid; place-items: center; color: var(--muted);
    transition: color 150ms var(--ease-out), background-color 150ms var(--ease-out), transform 160ms var(--ease-out);
  }
  .icon-btn:hover { color: var(--ink); background: var(--tile); }
  .icon-btn:active { transform: scale(.96); }
  .icon-btn svg { width: 17px; height: 17px; }
  .back svg { width: 18px; height: 18px; margin-left: -1px; }

  /* Cards */
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .card.is-new { animation: enter 220ms var(--ease-out); }
  @keyframes enter { from { opacity: 0; transform: translateY(4px); } }

  .card-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .card-title { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .card-plan {
    margin-left: auto; color: var(--muted); font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px;
  }

  /* Meters */
  .meters { display: flex; flex-direction: column; gap: 14px; transition: opacity 200ms var(--ease-out); }
  .meter { display: grid; grid-template-columns: 1fr auto; align-items: baseline; row-gap: 6px; }
  .meter-name { font-size: 13px; }
  .meter-value { font-size: 14px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; transition: color 150ms var(--ease-out); }
  .meter-value.warn { color: var(--warn); }
  .meter-value.high { color: var(--high); }

  .meter-track { grid-column: 1 / -1; position: relative; height: 6px; border-radius: 3px; background: var(--track); }
  /* Where usage would be at an even pace through the window */
  .meter-pace {
    position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 1px;
    background: var(--muted); transition: left 500ms var(--ease-out);
  }
  .meter-reset .runout { color: inherit; }
  .meter.warn .meter-reset .runout { color: var(--warn); }
  .meter.high .meter-reset .runout { color: var(--high); }
  .meter-fill {
    height: 100%; border-radius: 3px; background: var(--ink);
    transition: width 500ms var(--ease-out), background-color 200ms var(--ease-out);
  }
  .meter-fill.warn { background: var(--warn); }
  .meter-fill.high { background: var(--high); }

  .meter-reset {
    grid-column: 1 / -1; display: flex; justify-content: space-between;
    font-size: 12px; line-height: 1.3; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .meter.high .meter-reset { color: var(--ink); }

  .card.is-stale .meters { opacity: .45; }

  .note {
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
    font-size: 13px; line-height: 1.5; color: var(--muted);
  }
  .card-head + .note { margin-top: 0; padding-top: 0; border-top: 0; }
  .note.warn { color: var(--warn); }
  .note.error { color: var(--high); }
  .note b { font-weight: 600; color: var(--ink); }

  /* Cream pill, like the site's button */
  .action-row { display: flex; margin-top: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
    height: 32px; padding: 0 14px 0 12px; border-radius: 16px;
    background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 600;
    transition: background-color 150ms var(--ease-out), transform 160ms var(--ease-out), opacity 150ms var(--ease-out);
  }
  .btn svg { width: 15px; height: 15px; }
  .btn:hover { background: #fff; }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .55; cursor: default; transform: none; }
  .btn.small { height: 30px; padding: 0 12px 0 10px; border-radius: 15px; }
  .btn.small svg { width: 14px; height: 14px; }

  /* Footer */
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 4px; font-size: 12px; line-height: 1.3; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .footer .status.busy { color: var(--ink); }

  .spinning svg { animation: spin 900ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  .skeleton { height: 10px; border-radius: 5px; background: var(--track); animation: pulse 1.4s ease-in-out infinite; }
  .skeleton + .skeleton { margin-top: 10px; }

  /* Settings */
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; min-height: 56px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row-main { flex: 1; min-width: 0; }
  .row-name { font-size: 14px; font-weight: 600; line-height: 1.35; }
  .row-text { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-text.bad { color: var(--high); }
  .row-text.stale { color: var(--warn); }

  .switch { position: relative; width: 38px; height: 22px; flex-shrink: 0; border-radius: 11px; }
  .switch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; }
  .switch i { position: absolute; inset: 0; border-radius: 11px; background: var(--tile-line); pointer-events: none; transition: background-color 150ms var(--ease-out); }
  .switch i::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--muted); transition: transform 200ms var(--ease-out), background-color 150ms var(--ease-out);
  }
  .switch input:checked + i { background: var(--ink); }
  .switch input:checked + i::after { transform: translateX(16px); background: var(--bg); }
  .switch input:focus-visible + i { outline: 2px solid var(--ink); outline-offset: 2px; }

  .bottom { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; min-height: 30px; }
  .text-btn {
    display: inline-flex; align-items: center; gap: 6px; height: 30px; margin-left: -8px; padding: 0 8px; border-radius: 8px;
    color: var(--muted); font-size: 13px; font-weight: 600;
    transition: color 150ms var(--ease-out), background-color 150ms var(--ease-out), transform 160ms var(--ease-out);
  }
  .text-btn svg { width: 15px; height: 15px; }
  .text-btn:hover { color: var(--ink); background: var(--tile); }
  .text-btn:active { transform: scale(.96); }
  .version { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<div class="views">
  <section class="view" id="view-main" aria-label="Usage">
    <div class="header">
      <div class="title">AI Tray</div>
      <button class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.168 8A10.003 10.003 0 0 0 12 2C6.815 2 2.551 5.947 2.05 11"/><path d="M17 8h4.4a.6.6 0 0 0 .6-.6V3"/><path d="M2.881 16c1.544 3.532 5.068 6 9.168 6 5.186 0 9.45-3.947 9.951-9"/><path d="M7.05 16H2.65a.6.6 0 0 0-.6.6V21"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="m19.622 10.395-1.097-2.65L20 6l-2-2-1.735 1.483-2.707-1.113L12.935 2h-1.954l-.632 2.401-2.645 1.115L6 4 4 6l1.453 1.789-1.08 2.657L2 11v2l2.401.655L5.516 16.3 4 18l2 2 1.791-1.46 2.606 1.072L11 22h2l.604-2.387 2.651-1.098C16.697 18.831 18 20 18 20l2-2-1.484-1.75 1.098-2.652 2.386-.62V11l-2.378-.605Z"/></svg>
      </button>
      <button class="icon-btn close" title="Close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.758 17.243 12.001 12m5.243-5.243L12.001 12m0 0L6.758 6.757M12.001 12l5.243 5.243"/></svg>
      </button>
    </div>

    <div class="stack" id="cards">
      <div class="card" data-key="claude"><div class="card-head"><span class="card-title">Claude</span></div><div class="meters"><div><div class="skeleton"></div><div class="skeleton" style="width:70%"></div></div></div></div>
    </div>

    <div class="footer">
      <span class="status" id="status">Loading…</span>
      <span id="refreshTime"></span>
    </div>
  </section>

  <section class="view" id="view-settings" aria-label="Settings" inert>
    <div class="header">
      <button class="icon-btn back" id="backBtn" title="Back" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="title">Settings</div>
      <button class="icon-btn close" title="Close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.758 17.243 12.001 12m5.243-5.243L12.001 12m0 0L6.758 6.757M12.001 12l5.243 5.243"/></svg>
      </button>
    </div>

    <div class="list" id="services"></div>

    <div class="list" id="startupList" hidden>
      <div class="row">
        <div class="row-main"><div class="row-name">Open at startup</div></div>
        <label class="switch" title="Open AI Tray when Windows starts"><input type="checkbox" id="toggle-startup" aria-label="Open at startup"><i></i></label>
      </div>
    </div>

    <div class="bottom">
      <button class="text-btn" id="quitBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12h7m0 0-3 3m3-3-3-3"/><path d="M19 6V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1"/></svg>
        <span>Quit AI Tray</span>
      </button>
      <span class="version" id="version"></span>
    </div>
  </section>
</div>

<script>
  // Card definitions: id -> title. Claude is fetched in main.js, the rest in providers/.
  const CARDS = [
    { id: 'claude', title: 'Claude', name: 'Claude' },
    { id: 'codex', title: 'ChatGPT / Codex', name: 'ChatGPT' },
    { id: 'grok', title: 'Grok', name: 'Grok' },
  ];
  const OPTIONAL = ['codex', 'grok'];

  const LOGIN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12h-7m0 0 3 3m-3-3 3-3"/><path d="M19 6V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1"/></svg>';

  const pendingLogin = new Set();  // sign-ins waiting on the browser; survives re-renders
  let lastRendered = null;
  let config = { providers: {} };

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function level(pct) {
    if (pct < 60) return 'ok';
    if (pct < 85) return 'warn';
    return 'high';
  }

  function fmtTime(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function formatReset(isoDate) {
    if (!isoDate) return '';
    const diff = new Date(isoDate) - new Date();
    if (diff < 0) return 'resetting';
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    if (h >= 24) return `resets in ${Math.floor(h / 24)}d ${h % 24}h`;
    if (h > 0) return `resets in ${h}h ${m}m`;
    return `resets in ${m}m`;
  }

  function resetClock(isoDate) {
    if (!isoDate) return '';
    const d = new Date(isoDate);
    const sameDay = d.toDateString() === new Date().toDateString();
    return sameDay
      ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
      : d.toLocaleDateString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
  }

  // Turn raw fetch errors into one plain sentence
  function friendlyError(def, pu) {
    const raw = String(pu.error || pu.staleError || '');
    if (pu.needsLogin) return `Signed out of ${def.name}.`;
    if (/No Claude OAuth token/i.test(raw)) return 'Claude Code isn’t signed in on this PC.';
    if (/ENOTFOUND|EAI_AGAIN|ECONNREFUSED|ECONNRESET|dns|network|offline|fetch failed/i.test(raw)) return `Can’t reach ${def.name}. Check your connection.`;
    if (/timeout|timed out|aborted/i.test(raw)) return `${def.name} didn’t answer in time.`;
    if (/rate limit|429/i.test(raw)) return `${def.name} asked us to slow down. Trying again in a few minutes.`;
    return raw || 'Something went wrong.';
  }

  // ---------- Rendering: build HTML, then patch the live DOM so bars glide and buttons keep their state

  // Compare usage with how much of the window has passed. 'ok' = on track to finish under the
  // limit, 'warn' = heading for the limit before it resets, 'high' = nearly out or will run out well
  // before the reset. Windows without a known length fall back to plain thresholds.
  function pace(m, pct) {
    if (!m.minutes || !m.resets_at) return { lv: level(pct) };
    const total = m.minutes * 60000;
    const left = new Date(m.resets_at) - Date.now();
    const elapsed = Math.min(1, Math.max(0, 1 - left / total));
    if (pct >= 100) return { lv: 'high', elapsed };
    const projected = pct / Math.max(elapsed, 0.15);  // the first moments of a window are too noisy to judge
    const lv = pct >= 90 || projected >= 130 ? 'high' : projected >= 100 ? 'warn' : 'ok';
    let runsOut = null;
    if (lv !== 'ok' && pct > 0 && elapsed > 0) {
      const msToFull = (100 - pct) / pct * elapsed * total;
      if (msToFull < left) runsOut = new Date(Date.now() + msToFull).toISOString();
    }
    return { lv, elapsed, runsOut };
  }

  function renderMeter(m) {
    const pct = Math.max(0, Math.min(100, Math.round(m.utilization)));
    const { lv, elapsed, runsOut } = pace(m, pct);
    // The tick only appears once a window is under way (ChatGPT's don't start until first use)
    const marker = elapsed > 0.02 && elapsed < 1 ? `<i class="meter-pace" style="left:${(elapsed * 100).toFixed(1)}%" title="Even pace"></i>` : '';
    const right = runsOut ? `<span class="runout">runs out ${resetClock(runsOut)}</span>` : `<span>${resetClock(m.resets_at)}</span>`;
    return `
      <div class="meter ${lv}" data-key="${escapeHtml(m.label)}">
        <span class="meter-name">${escapeHtml(m.label)}</span>
        <span class="meter-value ${lv}">${m.valueText ? escapeHtml(m.valueText) : pct + '%'}</span>
        <div class="meter-track"><div class="meter-fill ${lv}" style="width:${pct}%"></div>${marker}</div>
        ${m.resets_at ? `<div class="meter-reset"><span>${formatReset(m.resets_at)}</span>${right}</div>` : ''}
      </div>`;
  }

  // Normalize Claude's native shape into the same {meters, ...} the other providers use
  function claudeToCard(cu) {
    if (!cu) return null;
    const out = { ...cu, meters: [] };
    if (cu.session) out.meters.push({ label: 'Session (5h)', utilization: cu.session.utilization, resets_at: cu.session.resets_at, minutes: 300 });
    if (cu.weekly) out.meters.push({ label: 'Weekly', utilization: cu.weekly.utilization, resets_at: cu.weekly.resets_at, minutes: 7 * 24 * 60 });
    if (cu.extraUsage && cu.extraUsage.is_enabled) {
      const eu = cu.extraUsage;
      out.meters.push({ label: 'Extra usage', valueText: `$${(eu.used_credits / 100).toFixed(2)} of $${(eu.monthly_limit / 100).toFixed(0)}`, utilization: eu.utilization, resets_at: null });
    }
    if (cu.error && /401|token|OAuth|expired/i.test(cu.error) && !/No Claude OAuth token/i.test(cu.error)) out.needsLogin = true;
    if (cu.staleError && /401|token|OAuth|expired/i.test(cu.staleError)) out.needsLogin = true;
    return out;
  }

  function signInButton(id, small) {
    const waiting = pendingLogin.has(id);
    return `<button class="btn${small ? ' small' : ''}" data-login="${id}"${waiting ? ' disabled' : ''}>${LOGIN_ICON}<span>${!waiting ? 'Sign in' : small ? 'Waiting…' : id === 'claude' ? 'Finish in the sign-in window…' : 'Finish in your browser…'}</span></button>`;
  }

  function renderCard(def, pu) {
    let head = '', body = '', note = '', stale = false;

    if (!pu) {
      body = '<div><div class="skeleton"></div><div class="skeleton" style="width:70%"></div></div>';
    } else if (pu.error) {
      const tone = /rate limit|429/i.test(pu.error) ? 'warn' : 'error';  // a slow-down isn't something to fix
      note = `<div class="note ${tone}">${escapeHtml(friendlyError(def, pu))}</div>`;
      if (pu.needsLogin) note += `<div class="action-row">${signInButton(def.id)}</div>`;
    } else {
      body = (pu.meters || []).map(renderMeter).join('') || '<div class="note">No usage data yet.</div>';
      if (pu.staleError) {
        stale = true;
        note = `<div class="note warn"><b>From ${fmtTime(pu.staleSince)}.</b> ${escapeHtml(friendlyError(def, { staleError: pu.staleError }))}</div>`;
        if (pu.needsLogin) note += `<div class="action-row">${signInButton(def.id)}</div>`;
      }
      head = pu.plan || '';
    }

    return `
      <div class="card${stale ? ' is-stale' : ''}" data-key="${def.id}">
        <div class="card-head">
          <span class="card-title">${def.title}</span>
          ${head ? `<span class="card-plan">${escapeHtml(head)}</span>` : ''}
        </div>
        ${body ? `<div class="meters">${body}</div>` : ''}
        ${note}
      </div>`;
  }

  // Patch `live` to match `next` in place. Nodes with a different tag or data-key are replaced.
  function morph(live, next) {
    for (const { name } of [...live.attributes]) if (!next.hasAttribute(name)) live.removeAttribute(name);
    for (const { name } of [...next.attributes]) {
      let value = next.getAttribute(name);
      if (name === 'class' && live.classList.contains('is-new')) value += ' is-new';  // let the enter animation finish
      if (live.getAttribute(name) !== value) live.setAttribute(name, value);
    }
    const a = [...live.childNodes], b = [...next.childNodes];
    b.forEach((n, i) => {
      const l = a[i];
      if (!l) return live.appendChild(adopt(n));
      if (l.nodeType !== n.nodeType || l.nodeName !== n.nodeName || (l.dataset && n.dataset && l.dataset.key !== n.dataset.key)) return live.replaceChild(adopt(n), l);
      if (l.nodeType === Node.TEXT_NODE) { if (l.nodeValue !== n.nodeValue) l.nodeValue = n.nodeValue; return; }
      if (l.nodeType === Node.ELEMENT_NODE) morph(l, n);
    });
    for (let i = a.length - 1; i >= b.length; i--) live.removeChild(a[i]);
  }

  // A node entering the page: cards fade up, bars grow from empty
  function adopt(node) {
    const el = node.cloneNode(true);
    if (el.nodeType !== Node.ELEMENT_NODE) return el;
    if (el.classList.contains('card') && hasRendered) {
      el.classList.add('is-new');
      el.addEventListener('animationend', () => el.classList.remove('is-new'), { once: true });
    }
    el.querySelectorAll('.meter-fill').forEach(fill => {
      const target = fill.style.width;
      fill.style.width = '0%';
      requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = target; }));
    });
    return el;
  }

  function patch(container, html) {
    const next = container.cloneNode(false);
    next.innerHTML = html;
    morph(container, next);
  }

  let hasRendered = false;
  function renderData(data) {
    if (!data) return;
    lastRendered = data;
    const enabled = data.enabledProviders || {};
    const html = [];
    for (const def of CARDS) {
      if (def.id !== 'claude' && !enabled[def.id]) continue;
      const pu = def.id === 'claude' ? claudeToCard(data.claudeUsage) : (data.providers || {})[def.id];
      html.push(renderCard(def, pu));
    }
    patch(document.getElementById('cards'), html.join(''));
    hasRendered = true;

    if (!refreshing) setStatus('');
    document.getElementById('refreshTime').textContent = data.refreshedAt ? `Updated ${fmtTime(data.refreshedAt)}` : '';
    renderServices(data);
    reportHeight();
  }

  // ---------- Settings view

  function serviceRow(id, name, text, cls, { login = false, toggle = false } = {}) {
    const checked = !!(config.providers && config.providers[id]);
    return `
      <div class="row" data-key="${id}">
        <div class="row-main">
          <div class="row-name">${name}</div>
          <div class="row-text${cls ? ' ' + cls : ''}" title="${escapeHtml(text)}">${escapeHtml(text)}</div>
        </div>
        ${login ? signInButton(id, true) : ''}
        ${toggle ? `<label class="switch" title="Show in AI Tray"><input type="checkbox" data-toggle="${id}" aria-label="Show ${name}"${checked ? ' checked' : ''}><i></i></label>` : ''}
      </div>`;
  }

  function renderServices(data) {
    const rows = [];
    const cu = data && data.claudeUsage;
    const claude = claudeToCard(cu);
    if (!cu) rows.push(serviceRow('claude', 'Claude', 'Checking…'));
    else if (claude.needsLogin) rows.push(serviceRow('claude', 'Claude', 'Signed out', 'bad', { login: true }));
    else if (cu.error && /No Claude OAuth token/i.test(cu.error)) rows.push(serviceRow('claude', 'Claude', 'Claude Code isn’t signed in', 'bad'));
    else if (cu.error && /rate limit|429/i.test(cu.error)) rows.push(serviceRow('claude', 'Claude', 'Busy, trying again soon', 'stale'));
    else if (cu.error) rows.push(serviceRow('claude', 'Claude', 'Can’t connect right now', 'bad'));
    else if (cu.staleError && /rate limit|429/i.test(cu.staleError)) rows.push(serviceRow('claude', 'Claude', 'Busy, trying again soon', 'stale'));
    else if (cu.staleError) rows.push(serviceRow('claude', 'Claude', 'Connected, last update failed', 'stale'));
    else rows.push(serviceRow('claude', 'Claude', cu.plan ? `Connected · ${cu.plan}` : 'Connected'));

    for (const id of OPTIONAL) {
      const def = CARDS.find(c => c.id === id);
      const on = !!(config.providers && config.providers[id]);
      const pu = data && data.providers && data.providers[id];
      if (!on) rows.push(serviceRow(id, def.title, 'Hidden', '', { toggle: true }));
      else if (!pu) rows.push(serviceRow(id, def.title, 'Checking…', '', { toggle: true }));
      else if (pu.needsLogin) rows.push(serviceRow(id, def.title, 'Signed out', 'bad', { toggle: true, login: true }));
      else if (pu.error && /rate limit|429/i.test(pu.error)) rows.push(serviceRow(id, def.title, 'Busy, trying again soon', 'stale', { toggle: true }));
      else if (pu.error) rows.push(serviceRow(id, def.title, 'Can’t connect right now', 'bad', { toggle: true }));
      else if (pu.staleError && /rate limit|429/i.test(pu.staleError)) rows.push(serviceRow(id, def.title, 'Busy, trying again soon', 'stale', { toggle: true }));
      else if (pu.staleError) rows.push(serviceRow(id, def.title, 'Connected, last update failed', 'stale', { toggle: true }));
      else rows.push(serviceRow(id, def.title, pu.plan ? `Connected · ${pu.plan}` : 'Connected', '', { toggle: true }));
    }
    patch(document.getElementById('services'), rows.join(''));
  }

  // ---------- Views

  let view = 'main';
  function showView(next, { instant = false } = {}) {
    if (next === view && !instant) return;
    const views = document.querySelector('.views');
    if (instant) views.classList.add('instant');
    const main = document.getElementById('view-main');
    const settings = document.getElementById('view-settings');
    main.inert = next !== 'main';
    settings.inert = next !== 'settings';
    view = next;
    reportHeight();
    if (instant) { void views.offsetWidth; views.classList.remove('instant'); }
    else (next === 'settings' ? document.getElementById('backBtn') : document.getElementById('settingsBtn')).focus({ preventScroll: true });
  }

  // ---------- Height, status

  // Tell the main process how tall the content is so the window can fit it
  function reportHeight() {
    requestAnimationFrame(() => window.ai.setHeight(Math.ceil(document.querySelector('.views').getBoundingClientRect().height)));
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(reportHeight);

  function setStatus(text, busy) {
    const s = document.getElementById('status');
    s.textContent = text;
    s.className = 'status' + (busy ? ' busy' : '');
  }

  // ---------- Events (delegated, so patched nodes keep working)

  let refreshing = false;
  document.getElementById('refreshBtn').addEventListener('click', async () => {
    if (refreshing) return;
    const btn = document.getElementById('refreshBtn');
    refreshing = true;
    btn.classList.add('spinning');
    setStatus('Refreshing…', true);
    await window.ai.refresh();
    refreshing = false;
    setStatus('');
    // Let the icon finish its turn instead of snapping back mid-spin
    btn.querySelector('svg').addEventListener('animationiteration', () => btn.classList.remove('spinning'), { once: true });
  });

  document.getElementById('settingsBtn').addEventListener('click', () => showView('settings'));
  document.getElementById('backBtn').addEventListener('click', () => showView('main'));
  document.querySelectorAll('.close').forEach(b => b.addEventListener('click', () => window.ai.closeWindow()));
  document.getElementById('quitBtn').addEventListener('click', () => window.ai.quit());

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (view === 'settings') showView('main');
    else window.ai.closeWindow();
  });

  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-login]');
    if (!btn || btn.disabled) return;
    const id = btn.dataset.login;
    pendingLogin.add(id);
    if (lastRendered) renderData(lastRendered);
    await (id === 'claude' ? window.ai.reAuthenticate() : window.ai.providerLogin(id));
    pendingLogin.delete(id);
    if (lastRendered) renderData(lastRendered);
  });

  document.addEventListener('change', async (e) => {
    const id = e.target.dataset && e.target.dataset.toggle;
    if (id) {
      config.providers = { ...config.providers, [id]: e.target.checked };
      await window.ai.saveConfig(config);
      return;
    }
    if (e.target.id === 'toggle-startup') {
      config.openAtLogin = e.target.checked;
      window.ai.setStartup(e.target.checked);
    }
  });

  // ---------- Start

  // Keep "resets in" countdowns current while the popup is open
  setInterval(() => { if (lastRendered) renderData(lastRendered); }, 60000);

  window.ai.onShowView(({ view: v, instant }) => showView(v, { instant }));
  window.ai.onDataUpdate((data) => renderData(data));

  (async () => {
    config = await window.ai.getConfig();
    const info = await window.ai.getAppInfo();
    document.getElementById('version').textContent = `Version ${info.version}`;
    if (info.startupAvailable) {
      document.getElementById('startupList').hidden = false;
      document.getElementById('toggle-startup').checked = info.openAtLogin;
    }
    const data = await window.ai.getData();
    if (data) renderData(data); else { renderServices(null); reportHeight(); }
  })();
</script>
</body>
</html>
