<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tray</title>
<style>
  @font-face { font-family: Inter; src: url('../assets/fonts/Inter.woff2') format('woff2'); font-weight: 100 900; font-display: block; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Warm near-black, cream ink */
  :root {
    --bg: #11100e;
    --ink: #efece6;
    --muted: #b3ada3;
    --line: #262420;
    --card: #191815;
    --tile: #1d1c19;
    --tile-line: #2e2c27;
    --track: #312e29;
    --warn: #f0b35e;
    --high: #f2826f;
    --accent: #0bcff3;
    --sans: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }

  html, body {
    width: 340px;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 500;
    font-size: 13px;
    line-height: 1.5;
    letter-spacing: -.011em;
    font-feature-settings: 'cv11', 'ss03';
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }
  svg { display: block; flex-shrink: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .app { display: flex; flex-direction: column; gap: 10px; padding: 12px 12px 12px; }

  /* Header: draggable to move the window */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2px 0 4px; height: 32px;
    -webkit-app-region: drag;
  }
  .logo { font-size: 14px; font-weight: 600; letter-spacing: -.015em; }
  .header-actions { display: flex; gap: 2px; -webkit-app-region: no-drag; }

  .icon-btn {
    width: 30px; height: 30px; border-radius: 8px;
    display: grid; place-items: center; color: var(--muted);
    transition: color .2s ease, background-color .2s ease, transform .15s ease;
  }
  .icon-btn:hover { color: var(--ink); background: var(--tile); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { width: 17px; height: 17px; }

  /* Cards */
  #cards { display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 14px 14px;
    transition: border-color .2s ease;
  }
  .card:hover { border-color: var(--tile-line); }

  .card-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .card-title { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .card-plan {
    margin-left: auto; color: var(--muted); font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px;
  }

  /* Meters */
  .meters { display: flex; flex-direction: column; gap: 14px; transition: opacity .3s ease; }
  .meter { display: grid; grid-template-columns: 1fr auto; align-items: baseline; row-gap: 6px; }
  .meter-name { font-size: 13px; }
  .meter-value { font-size: 14px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .meter-value.warn { color: var(--warn); }
  .meter-value.high { color: var(--high); }

  .meter-track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 3px; background: var(--ink); transition: width .6s cubic-bezier(.2, .8, .2, 1); }
  .meter-fill.warn { background: var(--warn); }
  .meter-fill.high { background: var(--high); }

  .meter-reset {
    grid-column: 1 / -1; display: flex; justify-content: space-between;
    font-size: 12px; line-height: 1.3; color: var(--muted); font-variant-numeric: tabular-nums;
  }

  .meter.high .meter-reset { color: var(--ink); }

  .card.is-stale .meters { opacity: .45; }

  .note {
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
    font-size: 13px; line-height: 1.5; color: var(--muted);
  }
  .card-head + .note { margin-top: 0; padding-top: 0; border-top: 0; }
  .note.warn { color: var(--warn); }
  .note.error { color: var(--high); }
  .note b { font-weight: 600; color: var(--ink); }

  /* One action per card: cream pill, like the site's button */
  .action-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
    height: 32px; padding: 0 14px; border-radius: 16px;
    background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 600;
    transition: background-color .2s ease, transform .15s ease, opacity .2s ease;
  }
  .btn svg { width: 15px; height: 15px; }
  .btn:hover { background: #fff; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .5; cursor: default; transform: none; }

  /* Footer */
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 4px; font-size: 12px; line-height: 1.3; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .footer .status.busy { color: var(--ink); }

  .spinning svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  .skeleton { height: 10px; border-radius: 5px; background: var(--track); animation: pulse 1.4s ease-in-out infinite; }
  .skeleton + .skeleton { margin-top: 10px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">AI Tray</div>
    <div class="header-actions">
      <button class="icon-btn" id="refreshBtn" title="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.168 8A10.003 10.003 0 0 0 12 2C6.815 2 2.551 5.947 2.05 11"/><path d="M17 8h4.4a.6.6 0 0 0 .6-.6V3"/><path d="M2.881 16c1.544 3.532 5.068 6 9.168 6 5.186 0 9.45-3.947 9.951-9"/><path d="M7.05 16H2.65a.6.6 0 0 0-.6.6V21"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="m19.622 10.395-1.097-2.65L20 6l-2-2-1.735 1.483-2.707-1.113L12.935 2h-1.954l-.632 2.401-2.645 1.115L6 4 4 6l1.453 1.789-1.08 2.657L2 11v2l2.401.655L5.516 16.3 4 18l2 2 1.791-1.46 2.606 1.072L11 22h2l.604-2.387 2.651-1.098C16.697 18.831 18 20 18 20l2-2-1.484-1.75 1.098-2.652 2.386-.62V11l-2.378-.605Z"/></svg>
      </button>
      <button class="icon-btn" id="quitBtn" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.758 17.243 12.001 12m5.243-5.243L12.001 12m0 0L6.758 6.757M12.001 12l5.243 5.243"/></svg>
      </button>
    </div>
  </div>

  <div id="cards">
    <div class="card" data-card="claude"><div class="card-head"><span class="card-title">Claude Max</span></div><div class="meters"><div><div class="skeleton"></div><div class="skeleton" style="width:70%"></div></div></div></div>
  </div>

  <div class="footer">
    <span class="status" id="status">Loading…</span>
    <span id="refreshTime"></span>
  </div>
</div>

<script>
  // Card definitions: id -> title. Claude is fetched in main.js, the rest in providers/.
  const CARDS = [
    { id: 'claude', title: 'Claude Max', name: 'Claude' },
    { id: 'codex', title: 'ChatGPT / Codex', name: 'ChatGPT' },
    { id: 'grok', title: 'Grok', name: 'Grok' },
  ];

  const ICONS = {
    login: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12h-7m0 0 3 3m-3-3 3-3"/><path d="M19 6V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1"/></svg>',
  };

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function level(pct) {
    if (pct < 60) return 'ok';
    if (pct < 85) return 'warn';
    return 'high';
  }

  function fmtTime(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function formatReset(isoDate) {
    if (!isoDate) return '';
    const diff = new Date(isoDate) - new Date();
    if (diff < 0) return 'resetting';
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    if (h >= 24) return `resets in ${Math.floor(h / 24)}d ${h % 24}h`;
    if (h > 0) return `resets in ${h}h ${m}m`;
    return `resets in ${m}m`;
  }

  function resetClock(isoDate) {
    if (!isoDate) return '';
    const d = new Date(isoDate);
    const sameDay = d.toDateString() === new Date().toDateString();
    return sameDay
      ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
      : d.toLocaleDateString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
  }

  // Turn raw fetch errors into one plain sentence
  function friendlyError(def, pu) {
    const raw = String(pu.error || pu.staleError || '');
    if (pu.needsLogin) return `Signed out of ${def.name}.`;
    if (/No Claude OAuth token/i.test(raw)) return 'Claude Code isn’t signed in on this PC.';
    if (/ENOTFOUND|EAI_AGAIN|ECONNREFUSED|ECONNRESET|dns|network|offline/i.test(raw)) return `Can’t reach ${def.name}. Check your connection.`;
    if (/timeout|timed out/i.test(raw)) return `${def.name} didn’t answer in time.`;
    if (/rate limit|429/i.test(raw)) return `${def.name} asked us to slow down. Trying again in a few minutes.`;
    return raw || 'Something went wrong.';
  }

  function renderMeter(m) {
    const pct = Math.max(0, Math.min(100, Math.round(m.utilization)));
    const lv = level(pct);
    return `
      <div class="meter ${lv}">
        <span class="meter-name">${escapeHtml(m.label)}</span>
        <span class="meter-value ${lv}">${m.valueText ? escapeHtml(m.valueText) : pct + '%'}</span>
        <div class="meter-track"><div class="meter-fill ${lv}" style="width:${pct}%"></div></div>
        ${m.resets_at ? `<div class="meter-reset"><span>${formatReset(m.resets_at)}</span><span>${resetClock(m.resets_at)}</span></div>` : ''}
      </div>`;
  }

  // Normalize Claude's native shape into the same {meters, ...} the other providers use
  function claudeToCard(cu) {
    if (!cu) return null;
    const out = { ...cu, meters: [] };
    if (cu.session) out.meters.push({ label: 'Session (5h)', utilization: cu.session.utilization, resets_at: cu.session.resets_at });
    if (cu.weekly) out.meters.push({ label: 'Weekly', utilization: cu.weekly.utilization, resets_at: cu.weekly.resets_at });
    if (cu.extraUsage && cu.extraUsage.is_enabled) {
      const eu = cu.extraUsage;
      out.meters.push({ label: 'Extra usage', valueText: `$${(eu.used_credits / 100).toFixed(2)} of $${(eu.monthly_limit / 100).toFixed(0)}`, utilization: eu.utilization, resets_at: null });
    }
    if (cu.error && /401|token|OAuth|expired/i.test(cu.error) && !/No Claude OAuth token/i.test(cu.error)) out.needsLogin = true;
    if (cu.staleError && /401|token|OAuth|expired/i.test(cu.staleError)) out.needsLogin = true;
    return out;
  }

  function actionButton(def, pu) {
    if (pu.needsLogin) return `<div class="action-row"><button class="btn" data-login="${def.id}">${ICONS.login}<span>Sign in</span></button></div>`;
    return '';
  }

  function renderCard(def, pu) {
    let head = '', body = '', note = '', stale = false;

    if (!pu) {
      body = '<div><div class="skeleton"></div><div class="skeleton" style="width:70%"></div></div>';
    } else if (pu.error) {
      note = `<div class="note error">${escapeHtml(friendlyError(def, pu))}</div>` + actionButton(def, pu);
    } else {
      body = (pu.meters || []).map(renderMeter).join('') || '<div class="note">No usage data yet.</div>';
      if (pu.staleError) {
        stale = true;
        note = `<div class="note warn"><b>From ${fmtTime(pu.staleSince)}.</b> ${escapeHtml(friendlyError(def, { staleError: pu.staleError }))}</div>` + actionButton(def, pu);
      }
      head = pu.plan || '';
    }

    return `
      <div class="card ${stale ? 'is-stale' : ''}" data-card="${def.id}">
        <div class="card-head">
          <span class="card-title">${def.title}</span>
          ${head ? `<span class="card-plan">${escapeHtml(head)}</span>` : ''}
        </div>
        ${body ? `<div class="meters">${body}</div>` : ''}
        ${note}
      </div>`;
  }

  function wireButtons(root) {
    root.querySelectorAll('[data-login]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.login;
        const label = btn.querySelector('span');
        const original = label.textContent;
        btn.disabled = true;
        label.textContent = id === 'claude' ? 'Finish in the sign-in window…' : 'Finish in your browser…';
        const result = id === 'claude' ? await window.ai.reAuthenticate() : await window.ai.providerLogin(id);
        if (result && result.success) {
          label.textContent = 'Signed in';
        } else {
          btn.disabled = false;
          label.textContent = original;
        }
      });
    });
  }

  // Tell the main process how tall the content is so the window can fit it
  function reportHeight() {
    requestAnimationFrame(() => {
      window.ai.setHeight(Math.ceil(document.documentElement.scrollHeight));
    });
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(reportHeight);

  let lastRendered = null;

  function renderData(data) {
    if (!data) return;
    lastRendered = data;
    const enabled = data.enabledProviders || {};
    const cards = document.getElementById('cards');
    const html = [];
    for (const def of CARDS) {
      if (def.id !== 'claude' && !enabled[def.id]) continue;
      const pu = def.id === 'claude' ? claudeToCard(data.claudeUsage) : (data.providers || {})[def.id];
      html.push(renderCard(def, pu));
    }
    cards.innerHTML = html.join('');
    wireButtons(cards);

    setStatus('');
    document.getElementById('refreshTime').textContent = data.refreshedAt ? `Updated ${fmtTime(data.refreshedAt)}` : '';
    reportHeight();
  }

  function setStatus(text, busy) {
    const s = document.getElementById('status');
    s.textContent = text;
    s.className = 'status' + (busy ? ' busy' : '');
  }

  // Keep "resets in" countdowns current while the popup is open
  setInterval(() => { if (lastRendered) renderData(lastRendered); }, 60000);

  document.getElementById('refreshBtn').addEventListener('click', async () => {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('spinning');
    setStatus('Refreshing…', true);
    await window.ai.refresh();
    btn.classList.remove('spinning');
    if (lastRendered) setStatus('');
  });

  document.getElementById('settingsBtn').addEventListener('click', () => window.ai.openSettings());
  document.getElementById('quitBtn').addEventListener('click', () => window.ai.closeWindow());

  window.ai.onDataUpdate((data) => renderData(data));
  window.ai.getData().then((data) => renderData(data));
</script>
</body>
</html>
